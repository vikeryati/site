<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дима БЕГИ!! | Школьный коридор</title>
<style>
* { box-sizing: border-box; }
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #dff3ff;
}
body {
    display: flex;
    align-items: center;
    justify-content: center;
}
#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #b88f70;
    background-image: url("фон.png");
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    user-select: none;
    touch-action: manipulation;
}
#ground {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 5%;
    background: transparent;
    border-top: 0;
    pointer-events: none;
}

#hud {
    position: absolute;
    z-index: 20;
    top: 18px;
    right: 22px;
    font-size: 22px;
    font-weight: bold;
    color: #263238;
    text-shadow: 0 1px white;
}

#player {
    position: absolute;
    z-index: 10;
    left: 72px;
    bottom: 5%;
    width: 95px;
    height: 125px;
    background-image: url("челик.png");
    background-repeat: no-repeat;
    background-size: 190px 125px;
    background-position: 0 0;
    image-rendering: pixelated;
    pointer-events: none;
}

.obstacle {
    position: absolute;
    z-index: 9;
    bottom: 5%;
    height: 125px;
    width: 89px;
    background-repeat: no-repeat;
    background-position: left bottom;
    background-size: contain;
    image-rendering: pixelated;
    pointer-events: none;
}

.obstacle.student-pair {
    width: 89px;
    height: 125px;
    background-image: url("препятствие.png");
}

.obstacle.student-phone {
    width: 58px;
    height: 108px;
    background-image: url("препятствие1.png");
}
#message {
    position: absolute;
    z-index: 30;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: rgba(20, 18, 24, .58);
    color: white;
    text-align: center;
}
#message h1 {
    margin: 0 0 10px;
    font-size: 44px;
}
#message p {
    margin: 5px 0;
    font-size: 20px;
}
#startBtn {
    margin-top: 18px;
    padding: 12px 26px;
    border: 0;
    border-radius: 10px;
    background: #3867a8;
    color: white;
    font-size: 19px;
    cursor: pointer;
}
#startBtn:hover { filter: brightness(1.1); }

#finalOverlay {
    position: absolute;
    z-index: 100;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 2s ease;
}
#finalOverlay.show {
    opacity: 1;
    pointer-events: all;
}
#finalText {
    color: white;
    font-size: clamp(30px, 5vw, 58px);
    font-weight: bold;
    text-align: center;
    opacity: 0;
    transition: opacity .8s ease;
}
#finalText.show { opacity: 1; }

@media (max-width: 600px) {
    #game { height: 100vh; }
    #hud { font-size: 18px; top: 12px; right: 12px; }
    #player {
        left: 35px;
        transform: scale(.85);
        transform-origin: bottom left;
    }
    #message h1 { font-size: 34px; }
}

.control-buttons {
    position: absolute;
    z-index: 40;
    top: 14px;
    left: 16px;
    display: flex;
    gap: 8px;
}

.control-btn {
    width: 42px;
    height: 42px;
    border: 0;
    border-radius: 10px;
    background: rgba(255,255,255,.78);
    color: #263238;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
}
.control-btn:hover { 
    background: rgba(255,255,255,.95);
    transform: scale(1.05);
}
.control-btn.muted {
    background: rgba(200,50,50,.7);
    color: white;
}

#settingsOverlay {
    position: absolute;
    z-index: 50;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
}
#settingsOverlay.active {
    display: flex;
}

.settings-card {
    background: white;
    border-radius: 20px;
    padding: 30px 35px;
    max-width: 450px;
    width: 90%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    animation: slideIn 0.3s ease;
}

@keyframes slideIn {
    from {
        opacity: 0;
        transform: translateY(-30px) scale(0.95);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.settings-card h2 {
    margin: 0 0 8px 0;
    color: #263238;
    font-size: 28px;
    display: flex;
    align-items: center;
    gap: 10px;
}
.settings-card .subtitle {
    color: #666;
    font-size: 14px;
    margin-bottom: 25px;
    border-bottom: 1px solid #eee;
    padding-bottom: 15px;
}

.setting-group {
    margin-bottom: 20px;
}
.setting-group label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 600;
    color: #333;
    font-size: 16px;
    margin-bottom: 6px;
}
.setting-group label span {
    color: #3867a8;
    font-size: 18px;
}

.setting-group input[type="range"] {
    width: 100%;
    height: 6px;
    background: #d1d9e6;
    border-radius: 3px;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
}
.setting-group input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #3867a8;
    cursor: pointer;
}
.setting-group input[type="range"]::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #3867a8;
    cursor: pointer;
    border: 0;
}

.settings-actions {
    display: flex;
    gap: 10px;
    margin-top: 25px;
    padding-top: 20px;
    border-top: 1px solid #eee;
}
.settings-actions button {
    flex: 1;
    padding: 12px;
    border: 0;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
}
.settings-actions .btn-save {
    background: #3867a8;
    color: white;
}
.settings-actions .btn-save:hover {
    background: #4a7fc9;
}
.settings-actions .btn-cancel {
    background: #e8ecf0;
    color: #333;
}
.settings-actions .btn-cancel:hover {
    background: #d5dbe3;
}
.settings-actions .btn-reset {
    background: #dc3545;
    color: white;
}
.settings-actions .btn-reset:hover {
    background: #c82333;
}

@media (max-width: 600px) {
    .control-buttons {
        top: 10px;
        left: 10px;
        gap: 6px;
    }
    .control-btn {
        width: 38px;
        height: 38px;
        font-size: 18px;
    }
    .settings-card {
        padding: 20px;
        max-width: 95%;
    }
    .settings-card h2 {
        font-size: 22px;
    }
    .setting-group label {
        font-size: 14px;
    }
}

#game:fullscreen { width: 100vw; height: 100vh; }
</style>
</head>
<body>

<div id="game">
    <div id="hud">Счёт: <span id="score">0</span> &nbsp; Рекорд: <span id="best">0</span></div>
    
    <div class="control-buttons">
        <button id="fullscreenBtn" class="control-btn" title="Полноэкранный режим">⛶</button>
        <button id="settingsBtn" class="control-btn" title="Настройки">⚙</button>
        <button id="soundBtn" class="control-btn" title="Звук">🔊</button>
    </div>

    <div id="player"></div>
    <div id="ground"></div>

    <div id="message">
        <h1>Дима БЕГИ!</h1>
        <p>Прыгай через детей и набирай очки.</p>
        <p><b>Пробел</b>, <b>↑</b> или клик по экрану — прыжок.</p>
        <button id="startBtn">Начать игру</button>
    </div>

    <div id="finalOverlay">
        <div id="finalText">Тебя ищет Миля</div>
    </div>

    <div id="settingsOverlay">
        <div class="settings-card">
            <h2>⚙ Настройки</h2>
            <div class="subtitle">Настройте игровые параметры</div>
            
            <div class="setting-group">
                <label>
                    Гравитация
                    <span id="gravityValue">0.70</span>
                </label>
                <input type="range" id="gravitySlider" min="0.2" max="1.5" step="0.05" value="0.70">
            </div>

            <div class="setting-group">
                <label>
                    Скорость
                    <span id="speedValue">6.0</span>
                </label>
                <input type="range" id="speedSlider" min="3" max="12" step="0.5" value="6">
            </div>

            <div class="setting-group">
                <label>
                    Цель победы
                    <span id="winScoreValue">12</span>
                </label>
                <input type="range" id="winScoreSlider" min="5" max="30" step="1" value="12">
            </div>

            <div class="setting-group">
                <label>
                    🔊 Громкость
                    <span id="volumeValue">100%</span>
                </label>
                <input type="range" id="volumeSlider" min="0" max="100" step="1" value="100">
            </div>

            <div class="settings-actions">
                <button class="btn-reset" id="resetDefaultsBtn">↺ Сброс</button>
                <button class="btn-cancel" id="settingsCancelBtn">Отмена</button>
                <button class="btn-save" id="settingsSaveBtn">✓ Сохранить</button>
            </div>
        </div>
    </div>
</div>

<script>
// ============================================================
// НАСТРОЙКИ
// ============================================================
const defaultSettings = {
    gravity: 0.70,
    speed: 6,
    winScore: 12,
    volume: 100,
    muted: false
};

let settings = { ...defaultSettings };

function loadSettings() {
    try {
        const saved = localStorage.getItem('dimaRunnerSettings');
        if (saved) {
            const parsed = JSON.parse(saved);
            settings = { ...defaultSettings, ...parsed };
        }
    } catch (e) {
        console.warn('Не удалось загрузить настройки:', e);
    }
}
loadSettings();

function saveSettings() {
    try {
        localStorage.setItem('dimaRunnerSettings', JSON.stringify(settings));
    } catch (e) {
        console.warn('Не удалось сохранить настройки:', e);
    }
}

// ============================================================
// АУДИОПЛЕЕР (MP3)
// ============================================================
const audioPlayer = {
    _audio: null,
    _isPlaying: false,
    _muted: settings.muted,
    _volume: settings.volume,

    init() {
        if (!this._audio) {
            this._audio = new Audio('/music.mp3');
            this._audio.loop = true;
            this._audio.volume = this._muted ? 0 : (this._volume / 100);
            this._audio.load();
        }
    },

    play() {
        this.init();
        if (!this._audio) return;
        this._audio.currentTime = 0;
        this._audio.play().then(() => {
            this._isPlaying = true;
        }).catch(e => {
            console.warn('Не удалось воспроизвести музыку:', e);
        });
    },

    stop() {
        if (this._audio) {
            this._audio.pause();
            this._isPlaying = false;
        }
    },

    toggleMute() {
        this._muted = !this._muted;
        settings.muted = this._muted;
        saveSettings();
        if (this._audio) {
            this._audio.muted = this._muted;
        }
        return this._muted;
    },

    setVolume(value) {
        this._volume = value;
        settings.volume = value;
        saveSettings();
        if (this._audio) {
            this._audio.volume = this._muted ? 0 : (value / 100);
        }
    },

    isPlaying() {
        return this._isPlaying;
    }
};

// ============================================================
// ИГРОВЫЕ ПЕРЕМЕННЫЕ
// ============================================================
const game = document.getElementById('game');
const player = document.getElementById('player');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const message = document.getElementById('message');
const startBtn = document.getElementById('startBtn');
const finalOverlay = document.getElementById('finalOverlay');
const finalText = document.getElementById('finalText');
const fullscreenBtn = document.getElementById('fullscreenBtn');
const settingsBtn = document.getElementById('settingsBtn');
const settingsOverlay = document.getElementById('settingsOverlay');
const soundBtn = document.getElementById('soundBtn');

const gravitySlider = document.getElementById('gravitySlider');
const gravityValue = document.getElementById('gravityValue');
const speedSlider = document.getElementById('speedSlider');
const speedValue = document.getElementById('speedValue');
const winScoreSlider = document.getElementById('winScoreSlider');
const winScoreValue = document.getElementById('winScoreValue');
const volumeSlider = document.getElementById('volumeSlider');
const volumeValue = document.getElementById('volumeValue');
const settingsSaveBtn = document.getElementById('settingsSaveBtn');
const settingsCancelBtn = document.getElementById('settingsCancelBtn');
const resetDefaultsBtn = document.getElementById('resetDefaultsBtn');

let running = false;
let score = 0;
let best = Number(localStorage.getItem('teacherRunnerBest') || 0);
let speed = settings.speed;
let gravity = settings.gravity;
let jumpPower = 15;
let playerY = 0;
let velocityY = 0;
let obstacles = [];
let spawnTimer = 0;
let animationId = 0;
let lastTime = 0;
let walkTime = 0;
let finalSequenceStarted = false;
let currentWinScore = settings.winScore;

bestEl.textContent = best;

// ============================================================
// ФУНКЦИИ ОБНОВЛЕНИЯ UI
// ============================================================
function updateSoundButton() {
    if (settings.muted) {
        soundBtn.textContent = '🔇';
        soundBtn.classList.add('muted');
    } else {
        soundBtn.textContent = '🔊';
        soundBtn.classList.remove('muted');
    }
}
updateSoundButton();

function updateSettingsUI() {
    gravitySlider.value = settings.gravity;
    gravityValue.textContent = settings.gravity.toFixed(2);
    speedSlider.value = settings.speed;
    speedValue.textContent = settings.speed.toFixed(1);
    winScoreSlider.value = settings.winScore;
    winScoreValue.textContent = settings.winScore;
    volumeSlider.value = settings.volume;
    volumeValue.textContent = settings.volume + '%';
}
updateSettingsUI();

// ============================================================
// ИГРОВАЯ ЛОГИКА
// ============================================================
function jump() {
    if (!running || finalSequenceStarted) return;
    if (playerY <= 0.5) {
        velocityY = jumpPower;
        player.classList.add('jumping');
    }
}

function createObstacle() {
    const el = document.createElement('div');
    const isPair = Math.random() < 0.5;
    el.className = `obstacle ${isPair ? 'student-pair' : 'student-phone'}`;
    const x = game.clientWidth + 20;
    el.style.left = x + 'px';
    game.appendChild(el);
    obstacles.push({ el, x });
}

function removeAllObstacles() {
    obstacles.forEach(o => o.el.remove());
    obstacles = [];
}

function startGame() {
    cancelAnimationFrame(animationId);
    removeAllObstacles();

    running = true;
    finalSequenceStarted = false;
    score = 0;
    speed = settings.speed;
    gravity = settings.gravity;
    currentWinScore = settings.winScore;
    playerY = 0;
    velocityY = 0;
    spawnTimer = 70;
    walkTime = 0;

    scoreEl.textContent = '0';
    message.style.display = 'none';
    finalOverlay.classList.remove('show');
    finalText.classList.remove('show');
    player.classList.remove('jumping');
    player.style.bottom = '5%';
    player.style.backgroundPosition = '0 0';

    // Запуск музыки
    if (!settings.muted) {
        audioPlayer.play();
    }

    lastTime = performance.now();
    animationId = requestAnimationFrame(loop);
}

function gameOver() {
    running = false;
    cancelAnimationFrame(animationId);
    player.classList.remove('jumping');
    audioPlayer.stop();

    if (score > best) {
        best = score;
        localStorage.setItem('teacherRunnerBest', best);
        bestEl.textContent = best;
    }

    message.innerHTML = `
        <div style="background:rgba(255,255,255,.96);padding:30px;border-radius:18px;min-width:300px;max-width:90%;">
            <h1 style="color:#263238;margin:0 0 10px;">Игра окончена!</h1>
            <p style="color:#333;font-size:20px;">Счёт: <b>${score}</b></p>
            <p style="color:#333;font-size:18px;">Рекорд: <b>${best}</b></p>
            <button id="restartBtn" style="margin-top:15px;padding:12px 26px;border:0;border-radius:10px;background:#3867a8;color:white;font-size:19px;cursor:pointer;">Играть снова</button>
        </div>
    `;
    message.style.display = 'flex';
    document.getElementById('restartBtn').addEventListener('click', startGame);
}

function finalGame() {
    if (finalSequenceStarted) return;
    finalSequenceStarted = true;
    running = false;
    cancelAnimationFrame(animationId);
    removeAllObstacles();
    player.classList.remove('jumping');
    audioPlayer.stop();

    if (score > best) {
        best = score;
        localStorage.setItem('teacherRunnerBest', best);
        bestEl.textContent = best;
    }

    finalOverlay.classList.add('show');
    setTimeout(() => {
        finalText.classList.add('show');
    }, 2000);
}

function intersects(a, b) {
    const ar = a.getBoundingClientRect();
    const br = b.getBoundingClientRect();
    const padX = 12;
    const padY = 10;
    return !(
        ar.right - padX < br.left + padX ||
        ar.left + padX > br.right - padX ||
        ar.bottom - padY < br.top + padY ||
        ar.top + padY > br.bottom - padY
    );
}

function animatePlayer(dt) {
    if (playerY > 0.5) {
        player.classList.add('jumping');
        player.style.backgroundPosition = '0 0';
        return;
    }
    player.classList.remove('jumping');
    walkTime += dt;
    const frame = Math.floor(walkTime / 10) % 2;
    player.style.backgroundPosition = `${-frame * 95}px 0`;
}

function loop(now) {
    if (!running) return;

    const dt = Math.min((now - lastTime) / 16.67, 2);
    lastTime = now;

    velocityY -= gravity * dt;
    playerY += velocityY * dt;

    if (playerY < 0) {
        playerY = 0;
        velocityY = 0;
        player.classList.remove('jumping');
    }

    player.style.bottom = `calc(5% + ${playerY}px)`;
    animatePlayer(dt);

    speed += 0.0018 * dt;

    spawnTimer -= dt;
    if (spawnTimer <= 0) {
        createObstacle();
        const minGap = Math.max(55, 105 - score * 0.35);
        const maxGap = Math.max(80, 145 - score * 0.25);
        spawnTimer = minGap + Math.random() * (maxGap - minGap);
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
        const o = obstacles[i];
        o.x -= speed * dt;
        o.el.style.left = o.x + 'px';

        if (intersects(player, o.el)) {
            gameOver();
            return;
        }

        if (o.x < -100) {
            o.el.remove();
            obstacles.splice(i, 1);
            score++;
            scoreEl.textContent = score;

            if (score >= currentWinScore) {
                finalGame();
                return;
            }
        }
    }

    animationId = requestAnimationFrame(loop);
}

// ============================================================
// ОБРАБОТЧИКИ СОБЫТИЙ
// ============================================================
fullscreenBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    if (!document.fullscreenElement) {
        game.requestFullscreen().catch(() => {});
    } else {
        document.exitFullscreen().catch(() => {});
    }
});

document.addEventListener('fullscreenchange', function() {
    fullscreenBtn.textContent = document.fullscreenElement ? '×' : '⛶';
});

settingsBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    settingsOverlay.classList.add('active');
});

settingsCancelBtn.addEventListener('click', function() {
    settingsOverlay.classList.remove('active');
});

settingsSaveBtn.addEventListener('click', function() {
    const newGravity = parseFloat(gravitySlider.value);
    const newSpeed = parseFloat(speedSlider.value);
    const newWinScore = parseInt(winScoreSlider.value);
    const newVolume = parseInt(volumeSlider.value);

    settings.gravity = newGravity;
    settings.speed = newSpeed;
    settings.winScore = newWinScore;
    settings.volume = newVolume;

    saveSettings();
    updateSettingsUI();
    settingsOverlay.classList.remove('active');

    gravity = newGravity;
    currentWinScore = newWinScore;
    audioPlayer.setVolume(newVolume);
    
    if (!running) {
        speed = newSpeed;
    }
});

resetDefaultsBtn.addEventListener('click', function() {
    settings = { ...defaultSettings };
    saveSettings();
    updateSettingsUI();
    gravitySlider.value = defaultSettings.gravity;
    gravityValue.textContent = defaultSettings.gravity.toFixed(2);
    speedSlider.value = defaultSettings.speed;
    speedValue.textContent = defaultSettings.speed.toFixed(1);
    winScoreSlider.value = defaultSettings.winScore;
    winScoreValue.textContent = defaultSettings.winScore;
    volumeSlider.value = defaultSettings.volume;
    volumeValue.textContent = defaultSettings.volume + '%';

    gravity = defaultSettings.gravity;
    currentWinScore = defaultSettings.winScore;
    audioPlayer.setVolume(defaultSettings.volume);
    if (!running) {
        speed = defaultSettings.speed;
    }
    updateSoundButton();
});

settingsOverlay.addEventListener('click', function(e) {
    if (e.target === settingsOverlay) {
        settingsOverlay.classList.remove('active');
    }
});

soundBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    const muted = audioPlayer.toggleMute();
    settings.muted = muted;
    saveSettings();
    updateSoundButton();
    if (!muted && running && !audioPlayer.isPlaying()) {
        audioPlayer.play();
    }
});

startBtn.addEventListener('click', startGame);

document.addEventListener('keydown', function(e) {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        if (!running && !finalSequenceStarted) {
            startGame();
        } else {
            jump();
        }
    }
    if (e.code === 'Escape' && settingsOverlay.classList.contains('active')) {
        settingsOverlay.classList.remove('active');
    }
});

game.addEventListener('pointerdown', function(e) {
    if (e.target.id === 'startBtn' || e.target.closest('#message')) return;
    if (e.target.closest('#settingsOverlay')) return;
    if (!running && !finalSequenceStarted) {
        startGame();
    } else {
        jump();
    }
});

// Инициализация аудио при первом клике
document.addEventListener('click', function() {
    audioPlayer.init();
}, { once: true });
