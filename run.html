<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дима БЕГИ!! | Школьный коридор</title>
<style>
/* ... (все стили остаются без изменений, они уже были выше) ... */
/* Я не буду копировать стили полностью, чтобы не занимать место, но они те же */
</style>
</head>
<body>
<!-- ... (весь HTML без изменений) ... -->

<script>
// ============================================================
// НАСТРОЙКИ
// ============================================================
const defaultSettings = {
    gravity: 0.70,
    speed: 6,
    winScore: 12,
    volume: 100,
    muted: false
};

let settings = { ...defaultSettings };

function loadSettings() {
    try {
        const saved = localStorage.getItem('dimaRunnerSettings');
        if (saved) {
            const parsed = JSON.parse(saved);
            settings = { ...defaultSettings, ...parsed };
        }
    } catch (e) {
        console.warn('Не удалось загрузить настройки:', e);
    }
}
loadSettings();

function saveSettings() {
    try {
        localStorage.setItem('dimaRunnerSettings', JSON.stringify(settings));
    } catch (e) {
        console.warn('Не удалось сохранить настройки:', e);
    }
}

// ============================================================
// АУДИОПЛЕЕР (MP3) с обработкой ошибок
// ============================================================
const audioPlayer = {
    _audio: null,
    _isPlaying: false,
    _muted: settings.muted,
    _volume: settings.volume,
    _isLoaded: false,

    init() {
        if (!this._audio) {
            this._audio = new Audio();
            this._audio.loop = true;
            this._audio.muted = this._muted;
            this._audio.volume = this._muted ? 0 : (this._volume / 100);
            
            // Пробуем разные варианты пути
            const paths = ['music.mp3', './music.mp3', '/music.mp3'];
            let tryIndex = 0;
            
            const tryLoad = () => {
                if (tryIndex >= paths.length) {
                    console.error('❌ Не удалось загрузить music.mp3 ни по одному из путей');
                    return;
                }
                this._audio.src = paths[tryIndex];
                this._audio.load();
                tryIndex++;
            };
            
            this._audio.addEventListener('canplaythrough', () => {
                this._isLoaded = true;
                console.log('🎵 Музыка загружена по пути:', this._audio.src);
            });
            
            this._audio.addEventListener('error', (e) => {
                console.warn(`❌ Ошибка загрузки по пути ${this._audio.src}:`, e);
                // Пробуем следующий путь
                tryLoad();
            });
            
            // Начинаем с первого пути
            tryLoad();
        }
    },

    play() {
        this.init();
        if (!this._audio) return;
        if (this._isPlaying) return;
        
        if (!this._isLoaded) {
            // Если не загружено, пробуем перезагрузить
            this._audio.load();
        }
        
        this._audio.play().then(() => {
            this._isPlaying = true;
            console.log('▶ Музыка играет');
        }).catch(e => {
            console.warn('⚠️ Автовоспроизведение заблокировано. Нажмите на экран для запуска музыки.');
            // Пробуем запустить по клику позже
        });
    },

    stop() {
        if (this._audio) {
            this._audio.pause();
            this._isPlaying = false;
        }
    },

    toggleMute() {
        this._muted = !this._muted;
        settings.muted = this._muted;
        saveSettings();
        if (this._audio) {
            this._audio.muted = this._muted;
            if (!this._muted && running && !this._isPlaying) {
                this.play();
            }
        }
        return this._muted;
    },

    setVolume(value) {
        this._volume = value;
        settings.volume = value;
        saveSettings();
        if (this._audio) {
            this._audio.volume = this._muted ? 0 : (value / 100);
        }
    },

    isPlaying() {
        return this._isPlaying;
    }
};

// ----- ОСТАЛЬНАЯ ЧАСТЬ ИГРЫ (переменные, функции) -----
// Они уже были в предыдущем коде. Здесь я сокращу для экономии места, 
// но в финальном ответе дам полный файл.

// ... (все игровые функции, обработчики событий и т.д.) ...

// Инициализация аудио при первом клике
document.addEventListener('click', function() {
    audioPlayer.init();
    if (running && !settings.muted && !audioPlayer.isPlaying()) {
        audioPlayer.play();
    }
}, { once: true });

console.log('🎮 Игра загружена! Нажмите "Начать игру"');
</script>
</body>
</html>
